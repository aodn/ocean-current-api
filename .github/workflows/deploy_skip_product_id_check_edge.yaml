name: Skip ProductId Check - Edge
run-name: Update skip_product_id_check flag and deploy to Edge

on:
  workflow_dispatch:
    inputs:
      skip_product_id_check:
        description: "Skip productId validation check for this deployment (use when intentionally updating productIds)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # The SSM flag is read only at task start, so changing it gives appdeploy no diff and nothing redeploys.
  # Re-push :latest with a new digest to force new tasks.
  # Long-term fix: add a force_new_deployment input to aodn/appdeploy deploy.yml and drop this job.
  repush_image:
    name: Re-push Latest Image
    runs-on: ubuntu-latest
    environment: central
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Configure AWS Credentials for image push
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to ECR Central
        uses: aws-actions/amazon-ecr-login@v2

      - name: Re-push latest image with a new digest
        id: push
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY"
          printf 'FROM %s:latest\nLABEL au.org.aodn.redeploy-run-id="%s"\n' "$image" "$RUN_ID" \
            | docker build --pull -t "$image:latest" -
          docker push "$image:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:latest" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RUN_ID: ${{ github.run_id }}

  update_ssm_and_deploy:
    name: Update SSM and Deploy to Edge
    runs-on: ubuntu-latest
    needs: repush_image
    environment: edge
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Update product id check flag in SSM Parameter
        run: |
          aws ssm put-parameter \
            --name "/apps/oceancurrent/edge/es_skip_product_id_check" \
            --type "String" \
            --value "$skip_product_id_check" \
            --overwrite
        env:
          skip_product_id_check: ${{ inputs.skip_product_id_check }}

      - name: Update Image Digest to SSM Parameter
        if: ${{ needs.repush_image.outputs.digest != '' }}
        run: |
          aws ssm put-parameter \
            --name "/apps/oceancurrent/edge/image_digest" \
            --type "String" \
            --value "$digest" \
            --overwrite
        env:
          digest: ${{ needs.repush_image.outputs.digest }}

      - name: Generate App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "appdeploy"

      - name: Trigger Deploy Workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 204
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: 'aodn',
              repo: 'appdeploy',
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                app_name: 'oceancurrent',
                environment: 'edge'
              }
            })
