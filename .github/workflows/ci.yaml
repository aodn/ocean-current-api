name: CI
run-name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  id-token: write
  contents: read #allow code checkout

# Cancel currently running workflow from the same PR or branch
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Verify Docker is running
        run: docker info

      - name: Build and Test with Gradle
        run: ./gradlew clean build

  test-scripts:
    name: Test Python Scripts
    # Pinned because Python 3.8 builds are only published for specific Ubuntu versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' # Matches the OceanCurrent legacy server (3.8.10)

      - name: Install dependencies
        run: python -m pip install pytest==8.3.5 requests==2.22.0 # requests matches the OceanCurrent legacy server

      - name: Run tests
        run: python -m pytest scripts
