name: CI
run-name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  id-token: write
  contents: read #allow code checkout

# Cancel currently running workflow from the same PR or branch
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Verify Docker is running
        run: docker info

      - name: Build and Test with Gradle
        run: ./gradlew clean build

  test-scripts:
    name: Test Python Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.11.8'

      # Python and dependency versions are set in scripts/cron/pyproject.toml and uv.lock
      - name: Run tests
        run: uv run --locked --project scripts/cron pytest scripts/cron
